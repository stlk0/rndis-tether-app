name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel runners; the app itself needs a phone and a desktop
        # session, so CI covers the universal build and the offline tests.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make app SWIFTFLAGS=-warnings-as-errors
      - name: Offline tests
        run: make test SWIFTFLAGS=-warnings-as-errors
      # Once: the format check does not depend on the architecture.
      - name: Format check
        if: matrix.os == 'macos-latest'
        run: make lint

  dist:
    # The archive install.sh downloads: the app with rndis-tether inside.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stlk0/rndis-tether
          ref: v1.1.1 # DAEMON_TAG in release.yml
          path: build/daemon
          persist-credentials: false
      - name: Build the archive
        run: |
          make dist SWIFTFLAGS=-warnings-as-errors DAEMON_SRC=build/daemon
          "build/RNDIS Tether.app/Contents/Helpers/rndis-tether" version

  homebrew:
    # The formula as it will be published, pointed at this checkout. It lives in the
    # stlk0/homebrew-tap repository, which installs as stlk0/tap; its dependency
    # rndis-tether comes from the same tap. Homebrew 6+ loads only formulae named in full.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, test and lint the formula
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          version=$(sed -n 's|^  url ".*/v\(.*\)\.tar\.gz"|\1|p' packaging/homebrew/rndis-tether-app.rb)
          archive="$RUNNER_TEMP/rndis-tether-app-$version.tar.gz"
          git archive --prefix="rndis-tether-app-$version/" HEAD -o "$archive"
          sum=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          brew tap-new --no-git local/ci
          formula="$(brew --repository)/Library/Taps/local/homebrew-ci/Formula/rndis-tether-app.rb"
          sed -e "s|^  url .*|  url \"file://$archive\"|" -e "s|^  sha256 .*|  sha256 \"$sum\"|" \
            packaging/homebrew/rndis-tether-app.rb > "$formula"
          brew install --build-from-source stlk0/tap/rndis-tether local/ci/rndis-tether-app
          brew test local/ci/rndis-tether-app
          brew style "$formula"
